name: Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_ios_screenshots:
        description: Build and launch the iOS simulator to capture screenshots
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter and Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test packages/cqut_widget_bridge/lib

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android unit tests
        working-directory: android
        run: >-
          bash ./gradlew
          :app:testDebugUnitTest
          :cqut_widget_bridge:testDebugUnitTest

      - name: Run Android lint
        working-directory: android
        run: >-
          bash ./gradlew
          :app:lintDebug
          :cqut_widget_bridge:lintDebug

      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/ci-upload-keystore.jks \
            -storepass ci-password \
            -keypass ci-password \
            -alias ci-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI, OU=CI, O=CQUT Helper, L=Chongqing, C=CN"
          printf '%s\n' \
            'storeFile=ci-upload-keystore.jks' \
            'storePassword=ci-password' \
            'keyAlias=ci-key' \
            'keyPassword=ci-password' > android/key.properties

      - name: Build release APK as smoke test
        run: flutter build apk --release

  ios:
    name: iOS release build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Select Xcode 26.3 and inspect environment
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Build unsigned device release
        run: |
          set -o pipefail
          mkdir -p build/ios-ci
          flutter build ios --release --no-codesign 2>&1 | tee build/ios-ci/release-build.log

      - name: Upload iOS release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build-log
          path: build/ios-ci/release-build.log
          if-no-files-found: warn

      - name: Build simulator app
        if: github.event_name == 'workflow_dispatch' && inputs.capture_ios_screenshots
        run: |
          set -o pipefail
          mkdir -p build/ios-smoke
          xcrun simctl list runtimes
          flutter build ios --simulator --debug 2>&1 | tee build/ios-smoke/build.log

      - name: Boot iPhone simulator and launch app
        if: github.event_name == 'workflow_dispatch' && inputs.capture_ios_screenshots
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for device in devices if device["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          DEVICE_STATE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; target=sys.argv[1]; print(next(device["state"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device["udid"] == target))' "$DEVICE_ID")
          if [ "$DEVICE_STATE" != "Booted" ]; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP=build/ios/iphonesimulator/Runner.app
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" "$BUNDLE_ID" | tee build/ios-smoke/launch.log
          sleep 15
          xcrun simctl spawn "$DEVICE_ID" launchctl list | tee build/ios-smoke/processes.log
          awk -v bundle="$BUNDLE_ID" '$1 ~ /^[0-9]+$/ && index($3, bundle) { alive=1 } END { exit !alive }' build/ios-smoke/processes.log
          xcrun simctl io "$DEVICE_ID" screenshot build/ios-smoke/launch.png

      - name: Collect simulator diagnostics
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.capture_ios_screenshots }}
        run: |
          mkdir -p build/ios-smoke
          if [ -n "${DEVICE_ID:-}" ]; then
            xcrun simctl spawn "$DEVICE_ID" log show --last 5m --style compact > build/ios-smoke/system.log 2>&1 || true
            xcrun simctl io "$DEVICE_ID" screenshot build/ios-smoke/final.png || true
          fi

      - name: Upload iOS smoke evidence
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.capture_ios_screenshots }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke
          path: build/ios-smoke/
          if-no-files-found: warn

  backend:
    name: Notice service checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: FastAPI/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r FastAPI/requirements.txt
          python -m pip check

      - name: Compile backend
        run: python -m compileall -q FastAPI

      - name: Run backend tests
        run: python -m unittest discover -s FastAPI -p 'test_*.py'
