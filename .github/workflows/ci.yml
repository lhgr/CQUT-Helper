name: Quality Gate

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter and Android checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --coverage

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Create temporary CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/ci-upload-keystore.jks \
            -storepass ci-password \
            -keypass ci-password \
            -alias ci-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI, OU=CI, O=CQUT Helper, L=Chongqing, C=CN"
          printf '%s\n' \
            'storeFile=ci-upload-keystore.jks' \
            'storePassword=ci-password' \
            'keyAlias=ci-key' \
            'keyPassword=ci-password' > android/key.properties

      - name: Build release APK as smoke test
        run: flutter build apk --release --dart-define=NOTICE_API_KEY=ci-placeholder

  backend:
    name: Notice service checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: FastAPI/requirements.txt

      - name: Install dependencies
        run: pip install -r FastAPI/requirements.txt

      - name: Compile backend
        run: python -m compileall -q FastAPI

      - name: Run backend tests
        run: python -m unittest discover -s FastAPI -p 'test_*.py'
