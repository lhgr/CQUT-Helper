name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag matching the selected source (vX.Y.Z)
        required: true
        type: string
      skip_release:
        description: Build artifacts only (allows a branch without a release tag)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release source and version
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.version.outputs.source_sha }}
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release metadata validation
        run: python3 -B -m unittest discover -s tool -p test_release_metadata.py -v

      - name: Resolve and validate version
        id: version
        env:
          DISPATCH_TAG_NAME: ${{ inputs.tag_name }}
          SKIP_RELEASE: ${{ inputs.skip_release }}
        run: python3 tool/release_metadata.py --release >> "$GITHUB_OUTPUT"

  android:
    name: Verify, sign and package Android
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      BUILD_NAME: ${{ needs.prepare.outputs.build_name }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - name: Checkout prepared source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test tool/ios_release_metadata.dart packages/cqut_widget_bridge/lib

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android unit tests
        working-directory: android
        run: >-
          bash ./gradlew
          :app:testDebugUnitTest
          :cqut_widget_bridge:testDebugUnitTest

      - name: Run Android lint
        working-directory: android
        run: >-
          bash ./gradlew
          :app:lintDebug
          :cqut_widget_bridge:lintDebug

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error ::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' \
            'storeFile=upload-keystore.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Build signed universal APK
        run: |
          set -o pipefail
          mkdir -p build/android-release/assets build/android-release/logs
          flutter build apk --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            2>&1 | tee build/android-release/logs/universal.log
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/android-release/assets/CQUT-Helper-universal.apk

      - name: Build signed split APKs
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            2>&1 | tee build/android-release/logs/split.log
          cp build/app/outputs/flutter-apk/app-*-release.apk build/android-release/assets/

      - name: Build signed Android App Bundle
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            2>&1 | tee build/android-release/logs/bundle.log
          cp build/app/outputs/bundle/release/app-release.aab \
            build/android-release/assets/CQUT-Helper.aab

      - name: Verify signatures and create checksums
        working-directory: build/android-release/assets
        run: |
          for artifact in *.apk *.aab; do
            jarsigner -verify "$artifact"
          done
          sha256sum *.apk *.aab > Android-SHA256SUMS.txt

      - name: Upload Android packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CQUT-Helper-android
          path: build/android-release/assets/
          if-no-files-found: warn

      - name: Upload Android build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build-log
          path: build/android-release/logs/
          if-no-files-found: warn

  ios:
    name: Package iOS
    needs: prepare
    uses: ./.github/workflows/ios-sideload.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      build_name: ${{ needs.prepare.outputs.build_name }}
      build_number: ${{ needs.prepare.outputs.build_number }}

  publish:
    name: Collect packages and prepare release draft
    needs: [prepare, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout prepared source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Download Android packages
        uses: actions/download-artifact@v4
        with:
          name: CQUT-Helper-android
          path: build/release

      - name: Download iOS package
        uses: actions/download-artifact@v4
        with:
          name: CQUT-Helper-unsigned-ios
          path: build/release

      - name: Verify packages and create combined checksums
        working-directory: build/release
        run: |
          sha256sum --check Android-SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          sha256sum *.apk *.aab *.ipa > CQUT-Helper-SHA256SUMS.txt

      - name: Upload complete release packages
        uses: actions/upload-artifact@v4
        with:
          name: CQUT-Helper-release
          path: |
            build/release/*.apk
            build/release/*.aab
            build/release/*.ipa
            build/release/CQUT-Helper-SHA256SUMS.txt
          if-no-files-found: error

      - name: Recheck release tag source
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_release
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$SOURCE_SHA"

      - name: Create or update draft release
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: Release ${{ needs.prepare.outputs.tag_name }}
          files: |
            build/release/*.apk
            build/release/*.aab
            build/release/*.ipa
            build/release/CQUT-Helper-SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
          prerelease: false
