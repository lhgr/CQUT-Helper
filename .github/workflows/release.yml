name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag name for release
        required: true
        default: v0.0.0
      skip_release:
        description: Skip creating release?
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, sign and package
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Resolve and validate version
        id: version
        env:
          DISPATCH_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import subprocess
          from pathlib import Path

          content = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"^version:\s*([0-9A-Za-z.\-]+)\+(\d+)\s*$", content, re.M)
          if not match:
              raise SystemExit("pubspec.yaml missing version like x.y.z+N")
          build_name, build_number = match.group(1), int(match.group(2))

          ref_type = os.environ.get("GITHUB_REF_TYPE", "").strip()
          ref_name = os.environ.get("GITHUB_REF_NAME", "").strip()
          dispatch_tag = os.environ.get("DISPATCH_TAG_NAME", "").strip()
          raw_tag = ref_name if ref_type == "tag" else dispatch_tag
          tag_version = raw_tag.removeprefix("v").split("+", 1)[0]
          if not tag_version or tag_version != build_name:
              raise SystemExit(
                  f"tag version ({tag_version or 'missing'}) does not match pubspec ({build_name})"
              )

          version_pattern = re.compile(r"^version:\s*[0-9A-Za-z.\-]+\+(\d+)\s*$", re.M)
          previous_numbers = []
          for tag in subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines():
              if tag.strip() == raw_tag:
                  continue
              try:
                  old = subprocess.check_output(
                      ["git", "show", f"{tag.strip()}:pubspec.yaml"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  continue
              old_match = version_pattern.search(old)
              if old_match:
                  previous_numbers.append(int(old_match.group(1)))
          if previous_numbers and build_number <= max(previous_numbers):
              raise SystemExit(
                  f"build number {build_number} must exceed previous maximum {max(previous_numbers)}"
              )

          print(f"build_name={build_name}")
          print(f"build_number={build_number}")
          print(f"tag_name={raw_tag}")
          PY

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NOTICE_API_KEY: ${{ secrets.NOTICE_API_KEY }}
        run: |
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            NOTICE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error ::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' \
            'storeFile=upload-keystore.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Build signed universal APK
        env:
          NOTICE_API_KEY: ${{ secrets.NOTICE_API_KEY }}
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --dart-define=NOTICE_API_KEY="$NOTICE_API_KEY"
          mv build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/CQUT-Helper-universal.apk

      - name: Build signed split APKs
        env:
          NOTICE_API_KEY: ${{ secrets.NOTICE_API_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --dart-define=NOTICE_API_KEY="$NOTICE_API_KEY"

      - name: Build signed Android App Bundle
        env:
          NOTICE_API_KEY: ${{ secrets.NOTICE_API_KEY }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.build_name }} \
            --build-number=${{ steps.version.outputs.build_number }} \
            --dart-define=NOTICE_API_KEY="$NOTICE_API_KEY"
          cp build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/bundle/release/CQUT-Helper.aab

      - name: Verify signatures and create checksums
        run: |
          for artifact in build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab; do
            jarsigner -verify "$artifact"
          done
          sha256sum \
            build/app/outputs/flutter-apk/CQUT-Helper-universal.apk \
            build/app/outputs/flutter-apk/app-*-release.apk \
            build/app/outputs/bundle/release/CQUT-Helper.aab \
            > build/CQUT-Helper-SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_release == 'false'
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          files: |
            build/app/outputs/flutter-apk/CQUT-Helper-universal.apk
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/CQUT-Helper.aab
            build/CQUT-Helper-SHA256SUMS.txt
          generate_release_notes: true
          draft: true
          prerelease: false
